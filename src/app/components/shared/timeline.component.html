<ol class="timeline" role="list" [attr.aria-labelledby]="labelledBy() || null">
  @for (item of items(); track item.id) {
    <li class="step" [class.step--experience]="item.kind === 'experience'" [appReveal]="$index * 90">
      <span class="marker" aria-hidden="true"></span>

      <div class="meta">
        <p class="years display">
          @if (item.end) {
            <span class="sr-only">De </span><time [attr.datetime]="item.start">{{ item.start }}</time
            ><span class="sep" aria-hidden="true">—</span><span class="sr-only"> à </span
            ><time [attr.datetime]="item.end">{{ item.end }}</time>
          } @else {
            <time [attr.datetime]="item.start">{{ item.start }}</time>
          }
        </p>
        <p class="chip kind">{{ kindLabel[item.kind] }}</p>
      </div>

      <div class="what">
        <h4 class="title serif">{{ item.title }}</h4>
        <p class="org">
          {{ item.organization }}@if (item.location) {<span>, {{ item.location }}</span>}
        </p>
      </div>

      <p class="desc">{{ item.description }}</p>
    </li>
  }
</ol>

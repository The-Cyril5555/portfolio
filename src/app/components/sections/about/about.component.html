<div class="container">
  <div class="portrait">
    <header class="head">
      <p class="eyebrow" appReveal>N°&nbsp;03 — Portrait</p>
      <h2 id="about-title" class="section-title" appReveal>À propos</h2>
    </header>

    <div class="bio">
      @for (paragraph of bio; track $index) {
        <p [class.lead]="$first" [appReveal]="$index * 90">{{ paragraph }}</p>
      }
    </div>

    <figure class="artwork" [appReveal]="120">
      <div class="frame">
        <img
          [src]="painting.src"
          [attr.srcset]="painting.srcset"
          [attr.sizes]="painting.sizes"
          [width]="painting.width"
          [height]="painting.height"
          alt="Un navire de guerre aux voiles claires tire un coup de canon sur une mer d’huile, enveloppé de fumée blanche."
          loading="lazy"
          decoding="async"
        />
      </div>
      <figcaption class="cartel">
        <span class="artist">Willem van de Velde le Jeune</span> —
        <span class="work"><cite>Le Coup de canon</cite>, vers&nbsp;1680</span>
      </figcaption>
    </figure>
  </div>

  <div class="parcours">
    <div class="parcours-head" appReveal>
      <h3 id="parcours-title" class="parcours-title serif">Parcours</h3>
      <p class="parcours-note">Formation et expérience, du plus récent au plus ancien</p>
    </div>

    <app-timeline [items]="parcours" labelledBy="parcours-title" />
  </div>
</div>

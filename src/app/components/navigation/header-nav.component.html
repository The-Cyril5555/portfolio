<header
  #bar
  class="bar"
  [class.is-dark]="onDark() && !menuOpen()"
  [class.is-open]="menuOpen()">
  <!-- Pas d'aria-label : le nom accessible reprend le texte visible (WCAG 2.5.3) -->
  <a class="brand" href="#home" (click)="go($event, 'home')">
    <span class="brand__name">Cyril Bizouarn</span>
    <span class="brand__role">UX/UI Designer, Developer</span>
    <span class="sr-only">– retour à l'accueil</span>
  </a>

  <nav class="links" aria-label="Navigation principale">
    <ul role="list">
      @for (link of links; track link.id) {
        @let active = scroll.activeSection() === link.id;
        <li>
          <a
            class="link"
            [class.is-active]="active"
            [href]="link.href"
            [attr.aria-current]="active ? 'true' : null"
            (click)="go($event, link.id)">{{ link.label }}</a>
        </li>
      }
    </ul>
  </nav>

  <button
    #burger
    type="button"
    class="burger"
    aria-controls="mobile-menu"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
    (click)="toggleMenu()">
    <span class="burger__line" aria-hidden="true"></span>
    <span class="burger__line" aria-hidden="true"></span>
    <span class="burger__line" aria-hidden="true"></span>
  </button>
</header>

<app-mobile-menu
  id="mobile-menu"
  data-swarm-ignore
  [open]="menuOpen()"
  [links]="links"
  [active]="scroll.activeSection()"
  (navigate)="go($event.event, $event.id)" />

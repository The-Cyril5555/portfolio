<!--
  Navigation principale - Fluid Glass (Three.js)
  ================================================

  Desktop : Canvas Three.js avec glass bar (MeshPhysicalMaterial transmission)
            + HTML overlay pour les liens de navigation
  Mobile  : CSS glass fallback + hamburger menu

  La barre glass réfracte le contenu de la page capturé via html2canvas.
-->

<div class="glass-navbar-container" #navContainer>
  <!-- Three.js Canvas (desktop only, hidden via CSS on mobile) -->
  <canvas #glassCanvas class="glass-canvas"></canvas>

  <!-- Nav Content Overlay -->
  <header class="nav-content" [class.scrolled]="isScrolled()" [class.three-active]="threeReady()">
    <!-- Logo et nom -->
    <div class="logo-container">
      <a
        href="#home"
        class="logo-name"
        (click)="scrollService.scrollToSection('home'); $event.preventDefault()"
        aria-label="Retour à l'accueil">
        Cyril Bizouarn
      </a>
      <span class="logo-subtitle">UX/UI DESIGNER, DEVELOPER</span>
    </div>

    <!-- Navigation Desktop -->
    <nav class="nav-links" aria-label="Navigation principale">
      @for (link of navLinks; track link.id) {
        <a
          [href]="link.href"
          class="nav-link"
          [class.active]="scrollService.activeSection() === link.id"
          [attr.aria-current]="scrollService.activeSection() === link.id ? 'page' : null"
          (click)="scrollService.scrollToSection(link.id); $event.preventDefault()">
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- Hamburger Button Mobile -->
    <button
      class="hamburger-button"
      [class.active]="mobileMenuOpen()"
      [class.scrolled]="isScrolled()"
      (click)="toggleMobileMenu()"
      aria-label="Toggle menu"
      [attr.aria-expanded]="mobileMenuOpen()">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </header>
</div>

<!-- Menu Mobile (component) -->
<app-mobile-menu
  [isOpen]="mobileMenuOpen()"
  [links]="navLinks"
  (close)="closeMenu()" />

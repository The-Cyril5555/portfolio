<div class="panel">
  <nav aria-labelledby="menu-title">
    <p class="eyebrow head" id="menu-title">Sommaire</p>
    <ol class="list" role="list">
      @for (link of links(); track link.id; let i = $index) {
        @let current = active() === link.id;
        <li class="item" [style.--i]="i">
          <a
            class="item__link"
            [class.is-active]="current"
            [href]="link.href"
            [attr.aria-current]="current ? 'true' : null"
            (click)="navigate.emit({ event: $event, id: link.id })">
            <span class="item__num" aria-hidden="true">{{ (i + 1).toString().padStart(2, '0') }}</span>
            <span class="item__label">{{ link.label }}</span>
          </a>
        </li>
      }
    </ol>
  </nav>

  <div class="foot" [style.--i]="links().length">
    <p class="eyebrow">Écrivez-moi</p>
    <a class="foot__mail link-arrow" [href]="'mailto:' + email">{{ email }}</a>
  </div>
</div>

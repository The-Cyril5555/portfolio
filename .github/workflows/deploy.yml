name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      # `npm run build` enchaîne `postbuild` : swarm-cursors.js est minifié dans
      # dist (esbuild, fourni par @angular/build ; le crédit /*! … */ est gardé).
      - name: Build Angular application
        run: npm run build -- --base-href=/portfolio/

      - name: Add .nojekyll file
        run: touch dist/portfolio-angular/browser/.nojekyll

      # Page unique sans routes : une URL inconnue sous /portfolio/ affiche
      # l'accueil (servi avec le statut 404 par GitHub Pages).
      - name: Create 404.html (copie de l'accueil)
        run: cp dist/portfolio-angular/browser/index.html dist/portfolio-angular/browser/404.html

      - name: Date the sitemap with the last commit
        run: sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>$(git log -1 --format=%cs)</lastmod>|" dist/portfolio-angular/browser/sitemap.xml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/portfolio-angular/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
